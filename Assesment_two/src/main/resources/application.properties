spring.application.name=Assesment_two

spring.datasource.url=jdbc:h2:mem:productsdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

# HikariCP connection pool optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Caffeine cache configuration (configured programmatically via CacheConfig)
spring.cache.type=caffeine

# Weather API configuration
weather.api.base-url=https://api.weatherapi.com/v1
weather.api.key=${WEATHER_API_KEY:DEMO_KEY}
weather.api.timeout-ms=5000
weather.api.retry-attempts=3
weather.api.retry-backoff-ms=500

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,caches
logging.level.com.example.Assesment_two=INFO
logging.level.org.hibernate.SQL=DEBUG
