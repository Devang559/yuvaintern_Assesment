name: Deploy

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw clean compile -B

      - name: Run tests
        run: ./mvnw test -B

      - name: Package application
        run: ./mvnw package -DskipTests -B

      - name: Generate test report
        run: |
          ./mvnw surefire-report:report -B || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: |
            target/*.jar
            target/surefire-reports/*.xml
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw package -DskipTests -B

      - name: Create source ZIP
        run: |
          mkdir -p release-artifacts
          ZIP_NAME="Assesment_two-v${GITHUB_REF_NAME}.zip"
          # Create ZIP excluding target, .git, .kilo, .github
          cd ..
          zip -r "Assesment_two/release-artifacts/${ZIP_NAME}" "Assesment_two/" \
            -x "*/target/*" "*/.git/*" "*/.kilo/*" "*/.github/*" "*/mvnw" "*/mvnw.cmd" "*/.mvn/wrapper/maven-wrapper.properties"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            release-artifacts/
            target/*.jar
            pdf_task1/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.zip
            target/*.jar
            pdf_task1/Weather_API_Integration_Test_Report.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Server
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      - name: Package application
        run: ./mvnw package -DskipTests -B

      - name: Deploy to server (SSH)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/assement-two
            pkill -f "java.*assement" || true
            cp target/*.jar app.jar
            nohup java -jar app.jar > app.log 2>&1 &
